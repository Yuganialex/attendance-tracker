{% extends "base.html" %}
{% block content %}
<div class="toolbar"><label>Date <input type="date" id="date"></label></div>
<div class="cards">
  <div class="card"><span>Total Students</span><b id="total">0</b></div>
  <div class="card green"><span>Present</span><b id="present">0</b></div>
  <div class="card red"><span>Absent</span><b id="absent">0</b></div>
  <div class="card yellow"><span>On Duty</span><b id="onduty">0</b></div>
  <div class="card ringcard">
    <div class="ring" id="ring"><span id="overall">0%</span></div>
    <div><span>Overall Attendance</span><small id="days"></small></div>
  </div>
</div>
<div class="grid2">
  <div class="panel"><h3>Status on selected date</h3><canvas id="pie"></canvas></div>
  <div class="panel"><h3>Student-wise attendance %</h3><canvas id="bar"></canvas></div>
</div>
{% endblock %}
{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>{% endblock %}
